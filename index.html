<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.pd span{font-weight:800;font-size:13px;color:var(--c)}
.pd.act span{color:#fff;text-shadow:0 0 3px #000}
.dice{width:56px;height:56px;border-radius:14px;border:4px solid var(--c);background:#fffaf0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;gap:2px;cursor:pointer}
.dice:disabled{opacity:.8;cursor:default}.dice i{border-radius:50%}.dice i.on{background:#3a1511}.dice.rdy{animation:p 1s infinite}

footer,.ft{text-align:center;line-height:1.6}
footer small,.ft small{display:block;font-size:10px;letter-spacing:4px;font-style:normal;text-transform:uppercase;opacity:.9}
</style></head><body>
<div id="app">
<header><div><span class="t">मिथिला लूडो</span><span class="s">Mithila Ludo</span></div><div style="display:flex;gap:6px;align-items:center"><button class="ib" id="snd">🔊</button><button class="ib" id="hm">🏠</button><div id="coin">🪙 <span id="cn">0</span> Mithila Coin</div></div></header>

<div class="fish">🐟</div><h1>मिथिला लूडो</h1><div class="sub">MITHILA LUDO</div>

<script>
const $=id=>document.getElementById(id),cv=$('cv'),x=cv.getContext('2d'),S=60,M=30;
const CL=['#d32f2f','#2e8b3d','#f2b705','#1e5fbf'],DK=['#8e1b1b','#1b5e25','#b58300','#123e80'];
const NM=['Janakpur','Sitamarhi','Darbhanga','Madhubani'];
const PATH=[[1,6],[2,6],[3,6],[4,6],[5,6],[6,5],[6,4],[6,3],[6,2],[6,1],[6,0],[7,0],[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[9,6],[10,6],[11,6],[12,6],[13,6],[14,6],[14,7],[14,8],[13,8],[12,8],[11,8],[10,8],[9,8],[8,9],[8,10],[8,11],[8,12],[8,13],[8,14],[7,14],[6,14],[6,13],[6,12],[6,11],[6,10],[6,9],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8],[0,7],[0,6]];
const SAFE=[0,8,13,21,26,34,39,47],YO=[[0,0],[9,0],[9,9],[0,9]],SL=[[1.5,1.5],[3.5,1.5],[1.5,3.5],[3.5,3.5]];
const HOME=(c,k)=>[[1+k,7],[7,1+k],[13-k,7],[7,13-k]][c];
const FACTS=["Madhubani painting Mithila ki pehchaan hai. Pehle ye ghar ki deewaron par banti thi.","Mithila ko Mata Sita ki janmbhoomi mana jaata hai (Sitamarhi/Janakpur).","Maithili bhasha Bharat ke Samvidhan ki aathvi anusuchi mein shamil hai.","Paag Mithila ka samman-chinh hai, jo atithi aur bade logon ko pehnaya jaata hai.","Machhli Mithila mein shubh aur samriddhi ka pratik hai.","Makhana Mithila ki khaas upaj hai. Darbhanga-Madhubani ka makhana mashhoor hai.","Vidyapati Mithila ke mahan kavi the, jinhe 'Maithil Kokil' kaha jaata hai.","Kohbar chitra Mithila mein vivah ke samay ghar mein banaye jaate hain.","Sama-Chakeva aur Jur-Sital Mithila ke apne parv hain.","Dahi-chura Mithila ki jaani-maani khaan-paan parampara hai."];
let G=null,coins=0,hits=[],busy=false,ip=null,sel={m:'c',n:2,l:1},mute=false,AC;
const HN=['लाल','हरियर','पीयर','नील'],EN=['Lal','Hariyar','Peeyar','Neel'],RK=['पहिल','दोसर','तेसर','चारिम'];
function sfx(f,d=.08,ty='sine',v=.12){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
try{coins=+localStorage.getItem('mcoin')||0}catch(e){}
const sl=ms=>new Promise(r=>setTimeout(r,ms)),cur=()=>G.act[G.turn];
function showCoin(){$('cn').textContent=coins;$('cn2').textContent=coins;try{localStorage.setItem('mcoin',coins)}catch(e){}}
function toast(t,ms=3200){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),ms)}
function showDice(v,c){c=c??cur();const e=$('d'+c);if(!e)return;const P={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[v];e.innerHTML=[...Array(9)].map((_,i)=>'<i class="'+(P.includes(i)?'on':'')+'"></i>').join('')}
function pos(c,i){const p=G.t[c][i];
 if(p<0)return[YO[c][0]+SL[i][0],YO[c][1]+SL[i][1]];
 if(p<=50)return PATH[(13*c+p)%52];
 if(p<=55)return HOME(c,p-51);
 return[7+[-.5,0,.5,0][c],7+[0,-.5,0,.5][c]]}
function flower(cx,cy,col){x.save();x.translate(cx,cy);x.fillStyle=col;for(let i=0;i<8;i++){x.rotate(Math.PI/4);x.beginPath();x.ellipse(0,-11,4.5,9,0,0,7);x.fill()}x.beginPath();x.arc(0,0,4,0,7);x.fillStyle='#fffaf0';x.fill();x.restore()}
function board(){
 x.setTransform(1,0,0,1,0,0);x.fillStyle='#f3d9a0';x.fillRect(0,0,960,960);x.translate(M,M);
 for(let i=0;i<=30;i++){const v=i*30;x.fillStyle=i%2?'#b3261e':'#2e8b3d';for(const[a,b]of[[v,-15],[v,915],[-15,v],[915,v]]){x.beginPath();x.arc(a,b,4,0,7);x.fill()}}
 x.strokeStyle='#6b2f17';x.lineWidth=1.5;
 for(let r=0;r<15;r++)for(let c=0;c<15;c++){
  if(!((c>=6&&c<=8)||(r>=6&&r<=8))||(c>=6&&c<=8&&r>=6&&r<=8))continue;
  let f='#fffaf0';
  for(let k=0;k<4;k++){if(PATH[13*k][0]==c&&PATH[13*k][1]==r)f=CL[k];for(let j=0;j<5;j++){const h=HOME(k,j);if(h[0]==c&&h[1]==r)f=CL[k]}}
  x.fillStyle=f;x.fillRect(c*S,r*S,S,S);x.strokeRect(c*S,r*S,S,S)}
 SAFE.forEach((a,n)=>{const p=PATH[a];flower(p[0]*S+30,p[1]*S+30,[0,13,26,39].includes(a)?'#fffaf0':'#b3261e')});
 for(let k=0;k<4;k++){const[ox,oy]=YO[k];x.fillStyle=CL[k];x.fillRect(ox*S,oy*S,6*S,6*S);x.strokeRect(ox*S,oy*S,6*S,6*S);
  x.fillStyle='#fffaf0';x.beginPath();x.roundRect((ox+.75)*S,(oy+1.1)*S,4.5*S,4.1*S,16);x.fill();
  x.fillStyle='#fffaf0';x.font='bold 26px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(NM[k],(ox+3)*S,(oy+.55)*S);
  SL.forEach(s=>{x.beginPath();x.arc((ox+s[0]+.5)*S,(oy+s[1]+.5)*S,.6*S,0,7);x.fillStyle=CL[k]+'55';x.fill();x.strokeStyle=DK[k];x.lineWidth=3;x.stroke()});x.lineWidth=1.5;x.strokeStyle='#6b2f17'}
 const T=[[[360,360],[360,540]],[[360,360],[540,360]],[[540,360],[540,540]],[[360,540],[540,540]]];
 T.forEach((t,k)=>{x.beginPath();x.moveTo(t[0][0],t[0][1]);x.lineTo(t[1][0],t[1][1]);x.lineTo(450,450);x.closePath();x.fillStyle=CL[k];x.fill();x.stroke()});
 x.font='26px serif';x.fillStyle='#fff';x.fillText('🐟',450,452)}
function draw(t){board();hits=[];if(!G)return;
 const L=[];for(const c of G.pl)for(let i=0;i<4;i++){const p=pos(c,i);L.push({c,i,x:p[0]+.5,y:p[1]+.5,y0:G.t[c][i]<0,m:G.st=='pick'&&c==cur()&&G.mv.includes(i)})}
 const g={};L.forEach(o=>{if(o.y0)return;(g[o.x+','+o.y]=g[o.x+','+o.y]||[]).push(o)});
 for(const k in g){const a=g[k];if(a.length>1)a.forEach((o,j)=>{o.x+=(j-(a.length-1)/2)*.3;o.s=.72})}
 L.sort((a,b)=>a.y-b.y).forEach(o=>{const px=o.x*S,py=o.y*S,r=S*.34*(o.s||1);
  x.beginPath();x.ellipse(px,py+r*.85,r*.9,r*.35,0,0,7);x.fillStyle='rgba(0,0,0,.3)';x.fill();
  x.beginPath();x.arc(px,py,r,0,7);x.fillStyle=CL[o.c];x.fill();x.lineWidth=3;x.strokeStyle='#fff';x.stroke();
  x.beginPath();x.arc(px,py,r*.5,0,7);x.fillStyle=DK[o.c];x.fill();
  x.beginPath();x.arc(px-r*.3,py-r*.3,r*.18,0,7);x.fillStyle='rgba(255,255,255,.7)';x.fill();
  if(o.m){x.beginPath();x.arc(px,py,r+6+Math.sin(t/120)*3,0,7);x.strokeStyle='#3a1511';x.lineWidth=4;x.stroke()}
  hits.push(o)})}
(function loop(t){draw(t);requestAnimationFrame(loop)})(0);
function cpuP(c){return G.cpu(c)}
function upd(){const c=cur(),cp=cpuP(c);
 $('turn').textContent=cp?'Computer ('+HN[c]+') khel raha hai...':HN[c]+' ('+NM[c]+') ki baari'+(G.st=='pick'?' - chamakti goti par tap karein':G.st=='roll'?' - apne pase par tap karein':'');
 $('turn').style.color=c==3?'#8ab4ff':CL[c];
 document.querySelectorAll('.pd').forEach(p=>{const k=+p.dataset.c,a=k==c,b=p.querySelector('button');if(!b)return;p.classList.toggle('act',a);b.disabled=!(a&&!cp&&G.st=='roll');b.classList.toggle('rdy',a&&!cp&&G.st=='roll')})}
function start(){const pl={2:[0,2],3:[0,1,2],4:[0,1,2,3]}[sel.n],h=sel.m=='h';
 G={pl,act:[...pl],rank:[],t:[0,1,2,3].map(()=>[-1,-1,-1,-1]),turn:0,v:0,mv:[],st:'roll',coin:!h,lv:sel.l,cpu:c=>h?false:c!=0};
 busy=false;$('menu').hidden=true;$('win').hidden=true;buildDice();showCoin();turnStart()}
function buildDice(){const mk=c=>G.pl.includes(c)?'<div class="pd" data-c="'+c+'" style="--c:'+CL[c]+'"><span>'+HN[c]+'</span><button class="dice" id="d'+c+'" aria-label="Pasa"></button></div>':'<div class="pd off"></div>';
 $('dt').innerHTML=mk(0)+mk(1);$('db').innerHTML=mk(3)+mk(2);
 G.pl.forEach(c=>{$('d'+c).onclick=()=>{if(G&&G.st=='roll'&&!cpuP(cur())&&cur()==c)roll()};showDice(1,c)})}
function turnStart(){G.st='roll';upd();if(cpuP(cur()))setTimeout(roll,800)}
function can(c,i,v){const p=G.t[c][i];return p<0?v==6:p+v<=56}
async function roll(){if(busy||!G||G.st!='roll')return;busy=true;const c=cur();
 document.querySelectorAll('.dice').forEach(b=>b.classList.remove('rdy'));
 for(let i=0;i<9;i++){showDice(1+Math.random()*6|0);sfx(200+i*25,.04,'square',.04);await sl(70)}
 const v=dv(c);G.v=v;showDice(v);sfx(420,.12);
 G.mv=[0,1,2,3].filter(i=>can(c,i,v));
 if(!G.mv.length){await sl(700);busy=false;return pass(false)}
 if(cpuP(c)){await sl(500);return go(c,pick(c))}
 if(G.mv.length==1){await sl(350);return go(c,G.mv[0])}
 busy=false;G.st='pick';upd()}
function sc(c,i,v){const p=G.t[c][i],n=p<0?0:p+v;let s=n;if(p<0)s+=30;if(n==56)s+=60;
 if(n<=50){const a=(13*c+n)%52;if(SAFE.includes(a))s+=15;else{for(const d of G.pl)if(d!=c)for(const q of G.t[d])if(q>=0&&q<=50&&(13*d+q)%52==a)s+=80;
  if(G.lv==2)for(const d of G.pl)if(d!=c)for(const q of G.t[d]){if(q<0||q>50)continue;const k=(a-(13*d+q)%52+52)%52;if(k>=1&&k<=6)s-=25}}}
 if(p>=0&&p<=50&&SAFE.includes((13*c+p)%52))s-=8;return s}
function pick(c){if(G.lv==0&&Math.random()<.4)return G.mv[Math.random()*G.mv.length|0];let b=G.mv[0],bs=-1e9;for(const i of G.mv){const s=sc(c,i,G.v);if(s>bs){bs=s;b=i}}return b}
function dv(c){let v=1+Math.random()*6|0;if(cpuP(c)&&G.lv>0&&false){let bs=-1e9;for(let k=1;k<=6;k++){const m=[0,1,2,3].filter(i=>can(c,i,k));if(!m.length)continue;const s=Math.max(...m.map(i=>sc(c,i,k)));if(s>bs){bs=s;v=k}}}return v}
function reward(c,n){if(G.coin&&!cpuP(c)){coins+=n;showCoin();toast('+'+n+' Mithila Coin 🪙')}}
function fact(){setTimeout(()=>toast('Mithila Jhalak: '+FACTS[Math.random()*FACTS.length|0],4500),1300)}
async function go(c,i){busy=true;G.st='move';G.mv=[];upd();const v=G.v;let cap=false,home=false;
 if(G.t[c][i]<0)G.t[c][i]=0;else for(let s=0;s<v;s++){G.t[c][i]++;sfx(520,.05,'triangle',.1);await sl(130)}
 const p=G.t[c][i];
 if(p<=50){const a=(13*c+p)%52;if(!SAFE.includes(a))for(const d of G.pl){if(d==c)continue;for(let j=0;j<4;j++){const q=G.t[d][j];if(q>=0&&q<=50&&(13*d+q)%52==a){G.t[d][j]=-1;cap=true}}}}
 if(cap){sfx(150,.3,'sawtooth',.15);reward(c,5);fact()}
 if(p==56){home=true;reward(c,10);fact()}
 if(G.t[c].every(q=>q==56))return fin(c);
 await sl(250);busy=false;pass(v==6||cap||home)}
function pass(extra){if(!extra)G.turn=(G.turn+1)%G.act.length;turnStart()}
function fin(c){G.rank.push(c);G.act.splice(G.turn,1);sfx(660,.4,'triangle',.15);
 if(G.coin||G.act.length<=1){if(!G.coin&&G.act.length==1)G.rank.push(G.act[0]);return win()}
 conf([CL[c],'#fff','#f2b705'],3500);const a=$('ann'),n=G.rank.length-1;a.style.background=CL[c];
 a.innerHTML='🏆 '+HN[c]+' '+RK[n]+' स्थान पर पहुँचल!<small>'+EN[c]+(n?' ne '+(n+1)+'nd/rd place pakda':' jeet gaya!')+' Baaki khilaadi khelte rahein</small>';
 a.hidden=false;a.style.animation='none';a.offsetWidth;a.style.animation='';setTimeout(()=>a.hidden=true,3800);
 G.turn%=G.act.length;busy=false;setTimeout(turnStart,1200)}
function win(){G.st='over';busy=false;const c=G.rank[0];$('wr').innerHTML='';

  else{$('wi').textContent='🙏';$('wt').textContent='हिम्मत नहि हारू!';$('wp').textContent='अहाँ बहुत नीक खेललहुँ! हार-जीत त खेलक हिस्सा छै। हमरा सभक समर्थन अहाँक संग अछि, फेर सँ प्रयास करू, जीत अहीँक होयत। मिथिला अहाँक संग अछि! 🙏 (अहाँक पास '+coins+' Mithila Coin अछि)'}}
 else{$('wi').textContent='🏆';$('wt').textContent=HN[c]+' जीत गेल! 🎉';$('wp').textContent=EN[c]+' jeet gaya! Badhai ho!';$('wr').innerHTML=G.rank.map((k,j)=>'<div style="background:'+CL[k]+'">'+RK[j]+' स्थान: '+HN[k]+' ('+NM[k]+')</div>').join('');conf(CL.concat('#fff'),6000)}
 $('win').hidden=false}
const cf=$('cf'),cx=cf.getContext('2d');let cfT=0;
function conf(cols,ms){cf.width=innerWidth;cf.height=innerHeight;const ps=[];for(let i=0;i<170;i++)ps.push({x:Math.random()*cf.width,y:-20-Math.random()*cf.height*.5,vx:Math.random()*4-2,vy:2+Math.random()*4,r:4+Math.random()*6,c:cols[i%cols.length],a:Math.random()*6,va:Math.random()*.3-.15});cfT=performance.now()+ms;cf.hidden=false;
 (function f(){cx.clearRect(0,0,cf.width,cf.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore();if(p.y>cf.height&&performance.now()<cfT){p.y=-10;p.x=Math.random()*cf.width}});if(performance.now()<cfT+1500)requestAnimationFrame(f);else cf.hidden=true})()}

cv.onclick=e=>{if(!G||G.st!='pick'||busy||cpuP(cur()))return;const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*16-.5,py=(e.clientY-r.top)/r.height*16-.5;
 let b=null,bd=.6;hits.forEach(o=>{if(!o.m)return;const d=Math.hypot(o.x-px,o.y-py);if(d<bd){bd=d;b=o}});if(b)go(b.c,b.i)};
const hi=()=>{document.querySelectorAll('[data-n]').forEach(b=>b.classList.toggle('sel',+b.dataset.n==sel.n));document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('sel',+b.dataset.l==sel.l))};

document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{sel.l=+b.dataset.l;hi()});
